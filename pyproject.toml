[tool.poetry]
name = "smart-portfolio-core"
version = "0.1.0"
description = "Sistema de gestión de portafolio financiero para el seminario de programación"
authors = ["Sergio Alejandro Castellanos <sergio@example.com>", "José Roberto Ospina Ospina <jose@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
yfinance = "^0.2"
scikit-learn = "^1.3"
numpy = "^1.24"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
fastapi = ">=0.100"
uvicorn = ">=0.23"
aiohttp = ">=3.9"
pandas = ">=2.0"
matplotlib = ">=3.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
python-dotenv = ">=1.0"
httpx = ">=0.24"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
