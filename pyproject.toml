[tool.poetry]
name = "smart-portfolio-core"
version = "0.1.0"
description = "Sistema de gestión y análisis de portafolio financiero — Seminario de Programación, Business Intelligence (Universidad Externado)"
authors = [
    "Sergio Alejandro Castellanos <scastellanos@phinodia.com>",
    "José Roberto Ospina Ospina <joseospina791011@gmail.com>",
]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
yfinance = "^0.2"
scikit-learn = "^1.3"
numpy = "^1.24"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
aiohttp = ">=3.9"
plotly = ">=5.18"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
python-dotenv = ">=1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
